<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Aprobación de Vales</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f7fafc;
    }
    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 8px;
      text-align: center;
      max-width: 85%;
      width: 380px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #2b6cb0;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="contenedor" class="card">
    <div class="spinner"></div>
    <p>Procesando solicitud, por favor espera...</p>
  </div>

  <script>
    // 1. REEMPLAZA ESTA URL POR LA URL DE TU WEB APP DESPLEGADA EN APPS SCRIPT (la que termina en /exec)
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwpAf2frOUnvstRxITKRYF5tte_XX8JCKL6JMw4rElwsIt3OS_aceFJrUNyb4xt32tmBA/exec";

    // 2. Capturar parámetros de la URL (?action=aprobar&id=SOL-2026-0001)
    const urlParams = new URLSearchParams(window.location.search);
    const action = urlParams.get('action');
    const id = urlParams.get('id');

    const contenedor = document.getElementById('contenedor');

    if (!action || !id) {
      contenedor.innerHTML = "<h2 style='color:red;'>Error</h2><p>Parámetros incompletos en la solicitud.</p>";
    } else {
      // 3. Consultar a Google Apps Script en tiempo real
      fetch(`${APPS_SCRIPT_URL}?action=${encodeURIComponent(action)}&id=${encodeURIComponent(id)}`)
        .then(response => response.text())
        .then(html => {
          // Reemplazar la pantalla de carga con la respuesta real de Apps Script
          document.body.innerHTML = html;
        })
        .catch(error => {
          console.error("Error al comunicarse con el servidor:", error);
          contenedor.innerHTML = "<h2 style='color:red;'>Error de Conexión</h2><p>No se pudo procesar la solicitud. Reintenta en unos segundos.</p>";
        });
    }
  </script>
</body>
</html>
